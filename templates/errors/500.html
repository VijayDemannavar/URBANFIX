{% extends "base.html" %}
{% block title %}500 – Server Error{% endblock %}
{% block content %}
<div class="container" style="text-align:center;padding:4rem 1rem;">
  <div style="font-size:4rem;margin-bottom:1rem;">⚠️</div>
  <h1 style="font-size:2rem;color:var(--brand-dark);margin-bottom:.5rem;">Something Went Wrong</h1>
  <p class="text-muted" style="margin-bottom:1.5rem;">
    An internal server error occurred. Please try again or contact support.
  </p>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
